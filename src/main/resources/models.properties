# ====================================
# MODELS — split out from application.properties
# Loaded via: spring.config.import=optional:classpath:models.properties
# Switch provider: gemini | openai | nim
# Env overrides: GEMINI_API_KEY, OPENAI_API_KEY, NVIDIA_API_KEY, TYPESAFE_API_KEY
# ====================================
chat.provider=nim

# --- Gemini ---
gemini.api-key=AIzaSyD7gOPouZ8OQVT5J1-o7GaSu6ceKf8_nco
gemini.model=gemini-2.5-flash-lite
gemini.temperature=0.1
gemini.max-tokens=2048
gemini.top-p=0.85

# --- OpenAI (ChatGPT) ---
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
openai.temperature=0.1
openai.max-tokens=2048
openai.timeout-seconds=60

# --- NVIDIA NIM (free tier, OpenAI-compatible) ---
nim.api-key=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
nim.model=nvidia/nemotron-3-super-120b-a12b
nim.temperature=0.1
nim.max-tokens=2048
nim.timeout-seconds=60

# --- Local embedding model (ONNX) ---
embedding.model.name=BGE Small EN v1.5

# --- Jev re-rank + Jev grounding (TypeSafe AI, System One Noul judgments) ---
# Dark by default: needs TYPESAFE_API_KEY; every failure falls back silently.
rag.rerank-provider=jev
# Grounding validation (single switch): none | llm | jev | jev,llm
#   llm = legacy second-NIM-call validator (slow, quota-hungry)
#   jev = TypeSafe Noul verdict (fast, cheap; needs TYPESAFE_API_KEY, else skipped)
#   jev,llm = cascade: Jev first; LLM confirms only if Jev passes. Fail open throughout.
rag.grounding-provider=jev

jev.model=jev-1.13.0
jev.api-key=apikey_2174ef4aaffbd4aa43649bf22a50c50e8c29_f37381fa905c22495ebd78eb36903f6851f423cc9174fafc36f257afa8a82c13
jev.base-url=https://api.typesafe.ai
jev.timeout-ms=8000
jev.max-candidates=50
jev.grounding-threshold=0.6
