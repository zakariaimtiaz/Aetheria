# ====================================
# DATABASE — split out from application.properties
# Loaded via: spring.config.import=optional:classpath:database.properties
# Env overrides: FSHIP_AI_DB_USR, FSHIP_AI_DB_PASS
# ====================================

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://devs2.apps.friendship.ngo:5432/fship_ai_1_1?currentSchema=fship_ai&options=-c%20search_path=fship_ai
spring.datasource.username=usr_ai
spring.datasource.password=u$r#VL
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=fship_ai
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# --- HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=5000

# --- PGVector store ---
vector.store.schema=fship_ai
vector.store.table-name=knowledge_base
vector.store.dimensions=384
vector.store.distance-type=COSINE
vector.store.index-type=IVFFLAT
# ivfflat.probes: how many of the index's `lists` clusters each search scans.
# PostgreSQL DEFAULTS THIS TO 1 — with lists=50 that hides ~98% of the corpus and
# silently causes "low recall" answers. 100 >= lists => effectively exact search,
# which is the correct choice at this corpus size. Lower only if vector latency
# is ever MEASURED as a problem.
vector.store.ivfflat-probes=100
# Must match the index built by schema.sql (ivfflat WITH (lists = 50)) and must be
# <= ivfflat-probes for a search to be effectively exact. schema.sql owns the
# index — the app never creates or alters it.
vector.store.index-list-size=50
# LangChain4j's default PGSimpleDataSource is UNPOOLED (a TCP+auth handshake per
# query). This is the pool size for the vector store's own connections.
vector.store.pool-size=5
vector.store.max-lifetime-ms=600000
