# ====================================
# APP INFO
# ====================================
# Split-out config files (all optional, same dir / classpath):
spring.config.import=optional:classpath:logging.properties,optional:classpath:database.properties,optional:classpath:models.properties
application.title=@project.name@
application.version=@project.version@

# ====================================
# SERVER CONFIGURATION
# ====================================
server.port=8080
server.servlet.context-path=/fshipbot
server.error.include-message=always

# ====================================
# Spring MVC / Thymeleaf
# ====================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ====================================
# RAG CONFIGURATION (model selectors live in models.properties)
# ====================================
conversation.memory.size=4
rag.top-k=20
rag.similarity-threshold=0.50
rag.max-context-length=14000
# Query expansion: uses extra LLM call to rewrite queries
# true/false
rag.query-expansion=false
# History-aware follow-up rewrite (zero LLM quota, local heuristic)
rag.query-rewrite.enabled=true

# Hybrid retrieval: vector (meaning) + lexical (exact keywords/codes/amounts) via RRF.
# Lexical falls back to ILIKE when content_tsv/pg_trgm is unavailable — never breaks queries.
rag.hybrid.enabled=true
rag.hybrid.vector-limit=100
rag.hybrid.lexical-limit=100
rag.hybrid.rrf-k=60
rag.hybrid.table-boost=0.08
# ====================================
# CUSTOM CONFIGURATION
# ====================================
app.ingestion.run-on-startup=true
docs.directory=E:/DBX/docs/markup
#docs.directory=/opt/fshipbot/docs/markup
docs.supported-extensions=.pdf,.doc,.docx,.txt,.xlsx,.pptx,.md,.markdown
# ====================================
# WEB CONTENT CONFIGURATION
# ====================================
# Comma-separated list of URLs to ingest into the same vector table as documents.
# Use the FULL form with "//" — "https:friendship.ngo" parses as an opaque URL
# with an empty host and is rejected at startup with a suggested fix.
web.urls=https://friendship.ngo/about-us/,https://friendship.ngo/what-we-do/,https://friendship.ngo/news/
# Web processing settings
web.batch-size=10
web.timeout-seconds=30
# User agent for web requests
web.user-agent=Mozilla/5.0 (compatible; FriendshipBot/1.0; +http://friendship.ngo)
# A page yielding less than this many chars of cleaned text is reported as FAILED
# rather than stored — the signature of a JS-rendered page or a nav-only page.
web.min-content-chars=300
# If boilerplate stripping would leave less than this, keep the unstripped text.
web.min-after-strip-chars=200

# ====================================
# DOCUMENT SPLITTER CONFIGURATION
# ====================================
docs.chunk-size=1000
docs.chunk-overlap=200
# Atomic tables: related rows stay in ONE chunk up to this budget so list/compare
# questions see all rows together. Prose still uses docs.chunk-size.
# Capped in code at 1800 (BGE 512-token ceiling) — larger values are clamped, not honored.
docs.table-max-chars=1800
docs.merge-adjacent-tables=true
docs.batch-size=10
docs.timeout-seconds=300
# ====================================
# EXCEL INGESTION (.xlsx/.xls in docs.directory, deterministic — no LLM quota)
# ====================================
app.ingestion.excel-enabled=true
excel.batch-size=20
excel.max-rows-per-sheet=5000


